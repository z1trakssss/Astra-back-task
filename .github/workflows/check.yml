name: Check
on:
  push:
  pull_request:
jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.yml -f compose.build.yml config
      - run: docker compose -f compose.yml -f compose.build.yml up -d --build
      - name: Wait for application
        run: |
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8000/health/ > /dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f compose.yml -f compose.build.yml logs app
          exit 1
      - run: python -c "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/sales/?page_size=1')); assert data['count']==340000"
      - if: always()
        run: docker compose -f compose.yml -f compose.build.yml down -v
