services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: astra
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra_demo_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra -d astra"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    image: astra-backend:local
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-demo-secret-change-me}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: astra
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra_demo_only
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SUPERUSER_USERNAME: demo
      DJANGO_SUPERUSER_EMAIL: demo@example.local
      DJANGO_SUPERUSER_PASSWORD: demo-only-change-me
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
